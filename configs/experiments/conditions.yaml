# Ordered primary comparison. Coefficients are resolved from one calibration artifact.
baseline:
  method: baseline
distillation:
  method: distillation
  all_layers: true
  aggregation: worst_layer
annealed_distillation:
  method: annealed_distillation
  all_layers: true
  aggregation: worst_layer
  anneal_fraction: 0.8
  anneal_schedule: cosine
mask_distillation:
  method: mask_distillation
  all_layers: true
  aggregation: worst_layer
  mask_type: top_p
